<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Student Academic Analytics and Risk Prediction System</title>
  <desc id="d">Project banner: title, subtitle and an abstract chart motif of grade bars, a pass-mark line and scattered points. The motif is decorative and shows no results.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#0f2a4a" opacity="0.07"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="0.55" stop-color="#f7f9fc" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#f7f9fc" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="20" fill="#f7f9fc"/>
  <rect width="1280" height="360" rx="20" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="19.5" fill="none" stroke="#0f2a4a" stroke-opacity="0.08"/>

  <!-- Decorative chart motif (right) -->
  <g transform="translate(760 64)">
    <line x1="0" y1="232" x2="440" y2="232" stroke="#0f2a4a" stroke-opacity="0.25"/>
    <g fill="#e07a5f" opacity="0.85">
      <rect x="8" y="196" width="22" height="36" rx="4"/>
      <rect x="36" y="214" width="22" height="18" rx="4"/>
      <rect x="64" y="186" width="22" height="46" rx="4"/>
      <rect x="92" y="160" width="22" height="72" rx="4"/>
      <rect x="120" y="132" width="22" height="100" rx="4"/>
    </g>
    <g fill="#14808c">
      <rect x="148" y="70" width="22" height="162" rx="4"/>
      <rect x="176" y="42" width="22" height="190" rx="4"/>
      <rect x="204" y="62" width="22" height="170" rx="4"/>
      <rect x="232" y="92" width="22" height="140" rx="4"/>
      <rect x="260" y="118" width="22" height="114" rx="4"/>
      <rect x="288" y="150" width="22" height="82" rx="4"/>
      <rect x="316" y="178" width="22" height="54" rx="4"/>
      <rect x="344" y="200" width="22" height="32" rx="4"/>
      <rect x="372" y="214" width="22" height="18" rx="4"/>
    </g>
    <line x1="145" y1="8" x2="145" y2="240" stroke="#0f2a4a" stroke-width="1.5" stroke-dasharray="5 5" stroke-opacity="0.55"/>
    <text x="153" y="20" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#0f2a4a" fill-opacity="0.7">pass mark</text>
    <g fill="#0f2a4a" fill-opacity="0.35">
      <circle cx="40" cy="96" r="4"/><circle cx="62" cy="84" r="3"/><circle cx="84" cy="78" r="5"/>
      <circle cx="226" cy="22" r="3"/><circle cx="262" cy="34" r="4"/><circle cx="300" cy="18" r="3"/>
      <circle cx="338" cy="40" r="5"/><circle cx="380" cy="26" r="3"/><circle cx="412" cy="52" r="4"/>
    </g>
    <path d="M30 104 C 120 80, 220 40, 420 30" fill="none" stroke="#2563eb" stroke-width="2" stroke-opacity="0.55"/>
  </g>
  <rect x="0" y="0" width="900" height="360" fill="url(#fade)"/>

  <!-- Text -->
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="72" y="70" width="40" height="40" rx="10" fill="#0f2a4a"/>
    <rect x="81" y="91" width="6" height="11" rx="2" fill="#f7f9fc" opacity="0.6"/>
    <rect x="89" y="85" width="6" height="17" rx="2" fill="#f7f9fc" opacity="0.8"/>
    <rect x="97" y="78" width="6" height="24" rx="2" fill="#14808c"/>
    <text x="126" y="97" font-size="15" font-weight="600" letter-spacing="1.6" fill="#14808c">ACADEMIC ANALYTICS · UCI STUDENT PERFORMANCE</text>
    <text x="72" y="170" font-size="46" font-weight="700" letter-spacing="-1.2" fill="#0f2a4a">Student Academic Analytics</text>
    <text x="72" y="224" font-size="46" font-weight="700" letter-spacing="-1.2" fill="#0f2a4a">and Risk Prediction System</text>
    <text x="72" y="270" font-size="19" fill="#3d4f66">Statistics · Exploratory analysis · Interpretable machine learning</text>
    <text x="72" y="298" font-size="15" fill="#5a6b82">FastAPI · scikit-learn · Next.js — academic risk (final grade below 10), not dropout</text>
  </g>
